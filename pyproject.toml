[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valora"
version = "0.2.0"
description = "Agentic AI economic simulation: learning market agents, an LLM policy council, a tool-using copilot and a benchmark harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3", "gymnasium>=0.29"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
valora = "valora.cli:main"

[tool.setuptools.packages.find]
include = ["valora*"]

[tool.setuptools.package-data]
valora = ["web/templates/*.html", "web/static/**/*", "harness/scenarios/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
